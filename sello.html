<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Verificar sello</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:6px 0 4px}
.lead{color:#9AA0AB;font-size:14px;margin:0 0 14px}
.card{background:#0E0F12;border:1px solid #26292F;border-radius:14px;padding:14px;margin-bottom:14px}
.ok{border-color:#2E7D5B;background:#0c1a14}.ok .big{color:#3ddc97}
.wait{border-color:#2E7D5B;background:#0c1a14}.wait .big{color:#9be7c4}
.warn{border-color:#E0A83A}.warn .big{color:#E0A83A}
.bad{border-color:#E5484D;background:#1a0c0d}.bad .big{color:#ff6b6f}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1c1f24}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:#9AA0AB}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#9AA0AB}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.small{color:#9AA0AB;font-size:13px;margin:6px 0 0}
.amt{font-size:28px;font-weight:800;margin:4px 0}
label{display:block;color:#9AA0AB;font-size:13px;margin:10px 0 4px}
input{width:100%;min-height:46px;border-radius:10px;border:1px solid #26292F;background:#000;color:#fff;font-size:16px;padding:0 12px}
button,a.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:12px;background:#4D6BFF;color:#fff;font-size:16px;font-weight:600;text-decoration:none;margin-top:14px;cursor:pointer}
a.link{display:block;text-align:center;color:#9AA0AB;font-size:13px;margin-top:12px}
details{margin-top:4px}summary{color:#9AA0AB;font-size:13px;cursor:pointer;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td{padding:6px 0;border-bottom:1px solid #1c1f24;vertical-align:top}td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.foot{color:#9AA0AB;font-size:12px;text-align:center;margin-top:18px}
.emb{display:flex;justify-content:center;margin:6px 0 14px}.emb svg{width:200px;height:200px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
/* Invoice Free del Obrero: verify a BSV seal.
   Nothing here trusts the app's server: every "verified" is checked against the real transaction on the BSV chain.
   Seal output: OP_FALSE OP_RETURN push("obrero") push(32-byte invoice fingerprint) [push(32-byte tag)]
   tag = SHA-256 of ["obrero-ref-1", memo, invoice #, total] -> anyone holding the invoice can rebuild it from the paper. */
(function(){
  var es=(navigator.language||'es').toLowerCase().indexOf('es')===0;
  var T=es?{
    title:'Verificar factura',lead:'Comprueba que una factura es la misma que se selló en la cadena BSV. Sirve para quien la manda y para quien la recibe.',
    memo:'Referencia (Memo)',num:'# de factura',total:'Total de la factura',check:'Verificar',checking:'Revisando la cadena BSV…',
    ok:'Factura verificada',okSub:'Estos datos están grabados en la cadena BSV. Nadie puede cambiarlos ni borrarlos.',
    wait:'Sellada · confirmando',waitSub:'Ya está en la red BSV. Queda en un bloque en unos 10 minutos.',
    sealedOn:'Sellada el',block:'En el bloque',inv:'Factura',from:'De',to:'Para',date:'Fecha',memoS:'Referencia',
    compare:'Compara estos datos con tu copia. Si el total o el # no coinciden, tu copia fue cambiada.',
    none:'No encontré un sello con estos datos',noneSub:'Revisa que escribiste bien la Referencia, el # y el total (con centavos). Si están bien, esta factura no se selló o fue cambiada después.',
    bad:'NO coincide',badSub:'La transacción existe, pero no contiene estos datos. La factura o el enlace fueron cambiados.',
    old:'Sello antiguo',oldSub:'Este sello solo guarda la huella. Para comprobar tu copia pide al emisor el enlace completo.',
    err:'No pude consultar la cadena desde aquí.',errSub:'Revisa tu conexión e inténtalo otra vez, o ábrela en el explorador.',
    lines:'Ver renglones sellados',tech:'Datos técnicos',hash:'Huella (SHA-256)',tx:'Transacción',net:'Red',test:'Prueba (testnet)',main:'Principal',
    open:'Ver en el explorador',other:'Verificar otra factura',fill:'Llena los tres datos.',foot:'Invoice Free del Obrero · Sello en BSV'
  }:{
    title:'Verify invoice',lead:'Check that an invoice is the same one that was sealed on the BSV blockchain. Works for the sender and the receiver.',
    memo:'Memo (reference)',num:'Invoice #',total:'Invoice total',check:'Verify',checking:'Checking the BSV blockchain…',
    ok:'Invoice verified',okSub:'These details are written on the BSV blockchain. Nobody can change or delete them.',
    wait:'Sealed · confirming',waitSub:'It is already on the BSV network. It lands in a block in about 10 minutes.',
    sealedOn:'Sealed on',block:'In block',inv:'Invoice',from:'From',to:'To',date:'Date',memoS:'Memo',
    compare:'Compare these details with your copy. If the total or the # don\'t match, your copy was changed.',
    none:'No seal found with these details',noneSub:'Check the Memo, invoice # and total (with cents). If they are right, this invoice was not sealed or was changed after.',
    bad:'Does NOT match',badSub:'The transaction exists but does not contain these details. The invoice or the link was changed.',
    old:'Older seal',oldSub:'This seal only keeps the fingerprint. To check your copy, ask the sender for the full link.',
    err:'Could not check the blockchain from here.',errSub:'Check your connection and try again, or open it in the explorer.',
    lines:'See sealed line items',tech:'Technical details',hash:'Fingerprint (SHA-256)',tx:'Transaction',net:'Network',test:'Test (testnet)',main:'Main',
    open:'View in explorer',other:'Verify another invoice',fill:'Fill in all three.',foot:'Invoice Free del Obrero · BSV seal'
  };
  document.documentElement.lang=es?'es':'en';document.title=T.title;
  var CFG=window.OBRERO_CONFIG||{};
  var app=document.getElementById('app');
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function kv(k,v,mono){var d=el('div','kv');d.appendChild(el('span',null,k));d.appendChild(el('span',mono?'mono':null,v));return d}
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
  function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(hex)}
  function normRef(x){return String(x||'').toUpperCase().replace(/[^0-9A-Z-]/g,'')}
  function normNum(x){return String(x||'').trim().toUpperCase()}
  function normAmt(x){return (Math.round((+String(x||'').replace(/[^0-9.]/g,'')||0)*100)/100).toFixed(2)}
  function tagOf(r,i,a){return sha(JSON.stringify(['obrero-ref-1',normRef(r),normNum(i),normAmt(a)]))}
  function money(a,c){try{return new Intl.NumberFormat(es?'es-MX':'en-US',{style:'currency',currency:c||'USD'}).format(+a)}catch(e){return '$'+normAmt(a)}}
  function fromB64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
  function api(net){return 'https://api.whatsonchain.com/v1/bsv/'+net+'/'}
  function explorer(net,tx){return (net==='main'?'https://whatsonchain.com/tx/':'https://test.whatsonchain.com/tx/')+tx}
  function getHex(net,tx){return fetch(api(net)+'tx/'+tx+'/hex').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text()}).then(function(h){return h.replace(/[^0-9a-f]/gi,'').toLowerCase()})}
  function getInfo(net,tx){return fetch(api(net)+'tx/hash/'+tx).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
  function fmtDate(sec){return new Date(sec*1000).toLocaleString(es?'es-MX':'en-US',{dateStyle:'medium',timeStyle:'short'})}

  var q0=new URLSearchParams(location.hash.slice(1)),kind=q0.get('k');
  if(kind==='photo'){T.title=es?'Verificar fotos':'Verify photos';T.ok=T.wait=es?'Fotos selladas':'Photos sealed';T.okSub=es?'La huella de estas fotos está grabada en la cadena de BSV. Prueba que existían así, sin cambios, en esa fecha.':'The fingerprint of these photos is written on the BSV blockchain. It proves they existed like this, unchanged, at that time.'}
  if(kind==='sig'){T.title=es?'Verificar firma':'Verify signature';T.ok=T.wait=es?'Firma sellada':'Signature sealed';T.okSub=es?'La huella de esta firma está grabada en la cadena de BSV. Prueba que el cliente firmó este documento en esa fecha, y nadie puede cambiarla ni borrarla.':'This signature fingerprint is written on the BSV blockchain. It proves the customer signed this document at that time, and nobody can change or delete it.';T.badSub=es?'La transacción existe, pero no contiene esta huella. La firma o el documento pudieron haber sido modificados.':'The transaction exists but does not contain this fingerprint. The signature or document may have been changed.'}
  document.title=T.title;
  app.appendChild(el('h1',null,T.title));
  var q=new URLSearchParams(location.hash.slice(1));
  var h=(q.get('h')||'').toLowerCase(),tx=(q.get('t')||'').toLowerCase(),net=q.get('n')==='main'?'main':'test';
  if(/^[0-9a-f]{64}$/.test(h)&&/^[0-9a-f]{64}$/.test(tx))linkMode();else searchMode();

  /* Result card shared by both modes */
  /* round seal stamp, like a notary seal: green when verified, amber while the block confirms, red when it does not match */
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function emblem(o){
    if(o.cls!=='ok'&&o.cls!=='wait'&&o.cls!=='bad')return;
    var col=o.cls==='ok'?'#3ddc97':o.cls==='wait'?'#E0A83A':'#ff6b6b';
    var ring=o.cls==='bad'?(es?'NO COINCIDE · NO COINCIDE · ':'DOES NOT MATCH · DOES NOT MATCH · '):(es?'SELLADO EN BSV · INVOICE FREE DEL OBRERO · ':'SEALED ON BSV · INVOICE FREE DEL OBRERO · ');
    var who=(o.canon&&o.canon[1])||'';if(who.length>26)who=who.slice(0,25)+'…';
    var mid=o.cls==='ok'?(es?'VERIFICADO':'VERIFIED'):o.cls==='wait'?(es?'CONFIRMANDO':'CONFIRMING'):(es?'NO VÁLIDO':'NOT VALID');
    var day=o.when?String(o.when).replace(/,?\s*\d{1,2}:\d{2}.*$/,'').slice(0,18):(es?'pendiente':'pending');
    var w=el('div','emb');w.setAttribute('role','img');w.setAttribute('aria-label',mid+(who?' · '+who:''));
    w.innerHTML='<svg viewBox="0 0 200 200"><defs><path id="rp" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>'+
      '<circle cx="100" cy="100" r="96" fill="none" stroke="'+col+'" stroke-width="4"/><circle cx="100" cy="100" r="64" fill="none" stroke="'+col+'" stroke-width="1.5"/>'+
      '<text fill="'+col+'" font-size="12.5" font-weight="700" letter-spacing="2" font-family="system-ui,sans-serif"><textPath href="#rp" textLength="478" lengthAdjust="spacing">'+esc(ring)+'</textPath></text>'+
      '<text x="100" y="'+(who?84:94)+'" text-anchor="middle" fill="'+col+'" font-size="30" font-weight="800" font-family="system-ui,sans-serif">'+(o.cls==='bad'?'✗':'✓')+'</text>'+
      '<text x="100" y="'+(who?106:118)+'" text-anchor="middle" fill="'+col+'" font-size="15" font-weight="800" letter-spacing="1" font-family="system-ui,sans-serif">'+esc(mid)+'</text>'+
      (who?'<text x="100" y="122" text-anchor="middle" fill="#fff" font-size="9" font-weight="600" font-family="system-ui,sans-serif" textLength="'+Math.min(112,who.length*5.4)+'" lengthAdjust="spacingAndGlyphs">'+esc(who)+'</text>':'')+
      '<text x="100" y="'+(who?137:136)+'" text-anchor="middle" fill="#9AA0AB" font-size="8.5" font-family="system-ui,sans-serif">'+esc(day)+'</text></svg>';
    app.appendChild(w)}
  function showResult(o){
    emblem(o);
    var box=el('div','card '+o.cls);box.appendChild(el('p','big',(o.cls==='ok'||o.cls==='wait'?'✓ ':o.cls==='bad'?'✗ ':'')+o.title));
    if(o.sub)box.appendChild(el('p','small',o.sub));
    app.appendChild(box);
    if(o.ref||o.canon){
      var c=el('div','card');
      if(o.ref&&o.ref.a){c.appendChild(el('p','small',T.total));c.appendChild(el('p','amt',money(o.ref.a,o.canon&&o.canon[7])))}
      if(o.canon&&o.canon[1])c.appendChild(kv(T.from,o.canon[1]));
      if(o.canon&&o.canon[4])c.appendChild(kv(T.to,o.canon[4]));
      if(o.ref&&o.ref.i)c.appendChild(kv(T.inv,'#'+o.ref.i));else if(o.canon)c.appendChild(kv(T.inv,'#'+o.canon[2]));
      if(o.canon&&o.canon[3])c.appendChild(kv(T.date,o.canon[3]));
      if(o.ref&&o.ref.r)c.appendChild(kv(T.memoS,o.ref.r));
      if(o.when)c.appendChild(kv(o.cls==='ok'?T.sealedOn:T.sealedOn,o.when));
      if(o.canon&&o.canon[5]&&o.canon[5].length){
        var dt=el('details');dt.appendChild(el('summary',null,T.lines));var tb=el('table');
        o.canon[5].forEach(function(it){var tr=el('tr');tr.appendChild(el('td',null,it[0]+' · '+it[1]+(it[2]?' '+it[2]:'')+' × '+money(it[3],o.canon[7])));tr.appendChild(el('td',null,money((+it[1]||0)*(+it[3]||0),o.canon[7])));tb.appendChild(tr)});
        dt.appendChild(tb);c.appendChild(dt)}
      if(o.cls==='ok'||o.cls==='wait')c.appendChild(el('p','small',T.compare));
      app.appendChild(c);
    }
    if(o.tx){
      var t=el('div','card');var dt2=el('details');dt2.appendChild(el('summary',null,T.tech));
      if(o.h)dt2.appendChild(kv(T.hash,o.h,1));dt2.appendChild(kv(T.tx,o.tx,1));dt2.appendChild(kv(T.net,o.net==='main'?T.main:T.test));
      if(o.block)dt2.appendChild(kv(T.block,String(o.block)));
      var a=el('a','link',T.open+' ↗');a.href=explorer(o.net,o.tx);a.target='_blank';a.rel='noopener';dt2.appendChild(a);
      t.appendChild(dt2);app.appendChild(t);
    }
    var again=el('a','link',T.other);again.href=location.pathname;again.onclick=function(){location.hash='';location.reload();return false};app.appendChild(again);
    app.appendChild(el('p','foot',T.foot));
  }
  /* Checks one transaction on chain. need = list of hex strings that must be inside the seal output. */
  function checkTx(n,t,need){
    return getHex(n,t).then(function(x){
      var ok=need.every(function(m){return x.indexOf(m)!==-1});
      return getInfo(n,t).then(function(j){return {ok:ok,conf:!!(j&&j.blocktime),when:j&&j.blocktime?fmtDate(j.blocktime):'',block:j&&j.blockheight}});
    });
  }

  /* Mode 1: opened from the QR / link on the invoice */
  function linkMode(){
    var status=el('div','card',T.checking);app.appendChild(status);
    var ref=q.get('r')&&q.get('i')&&q.get('a')?{r:normRef(q.get('r')),i:normNum(q.get('i')),a:normAmt(q.get('a'))}:null;
    var canon=null,cs=q.get('c');
    var p=Promise.resolve();
    if(cs)p=p.then(function(){var s=fromB64url(cs);return sha(s).then(function(x){if(x!==h)throw 'canon';canon=JSON.parse(s)})});
    var mark='066f627265726f20'+h,tg='';
    p.then(function(){return ref?tagOf(ref.r,ref.i,ref.a).then(function(x){tg=x}):null})
     .then(function(){return checkTx(net,tx,tg?[mark+'20'+tg]:[mark])})
     .then(function(r){status.remove();
        if(!r.ok)return showResult({cls:'bad',title:T.bad,sub:T.badSub,tx:tx,net:net,h:h});
        if(kind==='photo'||kind==='sig')return showResult({cls:r.conf?'ok':'wait',title:T.ok,sub:r.conf?T.okSub:T.okSub+' '+T.waitSub,tx:tx,net:net,h:h,when:r.when,block:r.block});
        if(!ref&&!canon)return showResult({cls:'warn',title:T.old,sub:T.oldSub,tx:tx,net:net,h:h,when:r.when,block:r.block});
        showResult({cls:r.conf?'ok':'wait',title:r.conf?T.ok:T.wait,sub:r.conf?T.okSub:T.waitSub,ref:ref,canon:canon,tx:tx,net:net,h:h,when:r.when,block:r.block});
     })
     .catch(function(e){status.remove();if(e==='canon')showResult({cls:'bad',title:T.bad,sub:T.badSub,tx:tx,net:net,h:h});else showResult({cls:'warn',title:T.err,sub:T.errSub,tx:tx,net:net,h:h})});
  }

  /* Mode 2: type Memo + invoice # + total from the paper */
  function searchMode(){
    app.appendChild(el('p','lead',T.lead));
    var f=el('form','card');
    function field(lbl,id,ph,mode){f.appendChild(el('label',null,lbl));var i=el('input');i.id=id;i.placeholder=ph;i.autocomplete='off';if(mode)i.inputMode=mode;f.appendChild(i);return i}
    var iRef=field(T.memo,'r','F1234-ABCD'),iNum=field(T.num,'i','1234'),iAmt=field(T.total,'a','1250.00','decimal');
    iRef.value=q.get('r')||'';iNum.value=q.get('i')||'';iAmt.value=q.get('a')||'';
    var msg=el('p','small');f.appendChild(msg);
    var b=el('button',null,T.check);b.type='submit';f.appendChild(b);
    app.appendChild(f);app.appendChild(el('p','foot',T.foot));
    f.onsubmit=function(ev){ev.preventDefault();
      var ref={r:normRef(iRef.value),i:normNum(iNum.value),a:normAmt(iAmt.value)};
      if(!ref.r||!ref.i||+ref.a<=0){msg.textContent=T.fill;return}
      b.disabled=true;msg.textContent=T.checking;
      tagOf(ref.r,ref.i,ref.a).then(function(tg){
        /* The database is only a phone book (tag -> transaction). The proof is the chain check below. */
        return fetch(CFG.supabaseUrl+'/rest/v1/rpc/find_seal',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey},body:JSON.stringify({p_tag:tg})})
          .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
          .then(function(rows){
            rows=(rows||[]).filter(function(x){return /^[0-9a-f]{64}$/.test(x.txid)});
            if(!rows.length)return {none:true};
            var last=rows[rows.length-1],n=last.net==='main'?'main':'test';
            return checkTx(n,last.txid,['20'+tg]).then(function(r){r.tx=last.txid;r.net=n;return r});
          });
      }).then(function(r){
        app.textContent='';app.appendChild(el('h1',null,T.title));
        if(r.none)return showResult({cls:'warn',title:T.none,sub:T.noneSub,ref:null});
        if(!r.ok)return showResult({cls:'bad',title:T.bad,sub:T.badSub,tx:r.tx,net:r.net});
        showResult({cls:r.conf?'ok':'wait',title:r.conf?T.ok:T.wait,sub:r.conf?T.okSub:T.waitSub,ref:ref,tx:r.tx,net:r.net,when:r.when,block:r.block});
      }).catch(function(){b.disabled=false;msg.textContent=T.err+' '+T.errSub});
    };
  }
})();
</script>
</body>
</html>
