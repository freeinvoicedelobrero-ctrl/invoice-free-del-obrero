<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Firmar documento</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:4px 0 2px}
.sub{color:#9AA0AB;font-size:14px;margin:0 0 14px}
.card{background:#0E0F12;border:1px solid #26292F;border-radius:14px;padding:14px;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #1c1f24}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:#cfd3da;overflow-wrap:anywhere}
.kv span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding-top:10px;font-variant-numeric:tabular-nums}
.small{color:#9AA0AB;font-size:13px}
.terms{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:13px;color:#cfd3da}
label{display:block;font-size:14px;color:#9AA0AB;margin:0 0 6px}
input.in{width:100%;min-height:48px;border-radius:12px;border:1px solid #26292F;background:#16181d;color:#fff;font:inherit;padding:10px 12px}
canvas{display:block;width:100%;height:170px;background:#fff;border-radius:12px;touch-action:none}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.linkbtn{background:none;border:0;color:#7f96ff;font:inherit;padding:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;color:#fff;font-size:15px}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
button.btn,a.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;border:0;background:#4D6BFF;color:#fff;font:inherit;font-weight:700;text-decoration:none;margin-top:10px}
a.btn.out,button.btn.out{background:none;border:1px solid #26292F;font-weight:600}
button.btn[disabled]{opacity:.6}
.ok{border-color:#2E7D5B;background:#0c1a14}.ok b{color:#3ddc97}
.warn{border-color:#E0A83A;color:#E0A83A}
.foot{color:#9AA0AB;font-size:12px;text-align:center;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
/* Remote signature. The document travels in the link (after #). The customer signs with a finger.
   The signature fingerprint is sealed on BSV and the signature goes back to the seller's app. */
(function(){
  var es=(navigator.language||'es').toLowerCase().indexOf('es')===0;
  var T=es?{title:'Firmar documento',bad:'Este enlace no es válido o está incompleto.',from:'De',est:'Presupuesto',inv:'Factura',total:'Total',terms:'Términos y condiciones',name:'Tu nombre completo',sign:'Firma con tu dedo',clear:'Borrar',agree:'Acepto el trabajo, el precio y los términos de arriba',btn:'Firmar y aceptar',signFirst:'Primero firma en el cuadro blanco.',nameFirst:'Escribe tu nombre.',agreeFirst:'Marca la casilla para aceptar.',sending:'Guardando y sellando en BSV…',done:'Firmado',doneSub:'Tu firma quedó guardada y su huella quedó grabada en la cadena de BSV. Nadie la puede cambiar.',noSeal:'Tu firma quedó guardada. El sello en BSV se hará en un momento.',verify:'Verificar sello',tell:'Avisar por WhatsApp',tellSms:'Avisar por mensaje',already:'Este documento ya fue firmado.',err:'No se pudo guardar la firma. Revisa tu internet y toca otra vez.',msg:function(n,k){return 'Ya firmé el '+(k==='estimate'?'presupuesto':'documento')+' #'+n+'.'}}
           :{title:'Sign document',bad:'This link is not valid or is incomplete.',from:'From',est:'Estimate',inv:'Invoice',total:'Total',terms:'Terms & conditions',name:'Your full name',sign:'Sign with your finger',clear:'Clear',agree:'I accept the work, price and terms above',btn:'Sign and accept',signFirst:'Please sign in the white box first.',nameFirst:'Please type your name.',agreeFirst:'Check the box to accept.',sending:'Saving and sealing on BSV…',done:'Signed',doneSub:'Your signature was saved and its fingerprint is written on the BSV blockchain. Nobody can change it.',noSeal:'Your signature was saved. The BSV seal will be added shortly.',verify:'Verify seal',tell:'Tell them on WhatsApp',tellSms:'Tell them by text',already:'This document was already signed.',err:'Could not save the signature. Check your internet and tap again.',msg:function(n,k){return 'I signed '+(k==='estimate'?'estimate':'document')+' #'+n+'.'}};
  document.documentElement.lang=es?'es':'en';document.title=T.title;
  var app=document.getElementById('app'),CFG=window.OBRERO_CONFIG||{};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function fail(t){app.textContent='';app.appendChild(el('h1',null,T.title));app.appendChild(el('div','card warn',t||T.bad))}
  function rpc(fn,args){return fetch(CFG.supabaseUrl+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.status===204?null:r.json()})}
  function valid(o){return o&&o.v===1&&/^[0-9a-f]{32}$/.test(o.t||'')&&/^[0-9a-f]{64}$/.test(o.h||'')&&window.crypto&&crypto.subtle}
  var raw=location.hash.slice(1),short=/^t=([0-9a-f]{32})$/.exec(raw);
  if(short){
    /* short link: the document waits in the cloud under the token */
    if(!CFG.supabaseUrl){fail();return}
    app.textContent=es?'Cargando…':'Loading…';
    rpc('sign_doc',{p_tok:short[1]}).then(function(rows){var r=rows&&rows[0];var o=r?JSON.parse(r.doc):null;if(!valid(o)||o.t!==short[1]){fail();return}app.textContent='';start(o)}).catch(function(){fail(es?'No pude cargar el documento. Revisa tu internet y abre el link otra vez.':'Could not load the document. Check your internet and open the link again.')});
    return;
  }
  var o=null;
  try{var s=raw.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';o=JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){o=null}
  if(!valid(o)){fail();return}
  start(o);
  function start(o){
  var cur=/^[A-Z]{3}$/.test(o.cur)?o.cur:'USD';
  function money(v){try{return new Intl.NumberFormat(es?'es-MX':'en-US',{style:'currency',currency:cur}).format(+v||0)}catch(e){return cur+' '+v}}
  function sha(str){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
  var KEY='obrero-signed-'+o.t;
  var kindLbl=o.k==='estimate'?T.est+' EST ':T.inv+' #';
  app.appendChild(el('h1',null,T.title));
  app.appendChild(el('p','sub',(o.s?T.from+' '+String(o.s).slice(0,80)+' · ':'')+kindLbl+String(o.n).slice(0,20)+(o.dt?' · '+o.dt:'')));
  var c1=el('div','card');
  if(o.c){var who=el('div','kv');who.appendChild(el('span',null,es?'Cliente':'Customer'));who.appendChild(el('span',null,String(o.c).slice(0,80)));c1.appendChild(who)}
  (o.it||[]).slice(0,60).forEach(function(i){var k=el('div','kv');k.appendChild(el('span',null,String(i[0]||'—').slice(0,140)+(+i[1]&&+i[1]!==1?' × '+i[1]:'')));k.appendChild(el('span',null,money((+i[1]||0)*(+i[3]||0))));c1.appendChild(k)});
  var tt=el('div','tot');tt.appendChild(el('span',null,T.total));tt.appendChild(el('span',null,money(o.tot)));c1.appendChild(tt);app.appendChild(c1);
  if(o.terms){var c2=el('div','card');c2.appendChild(el('div','small',T.terms));c2.appendChild(el('div','terms',String(o.terms).slice(0,6000)));app.appendChild(c2)}
  if(o.acc)app.appendChild(el('p','small',String(o.acc).slice(0,600)));
  var form=el('div','card');
  form.innerHTML='<label for="nm"></label><input class="in" id="nm" autocomplete="name"><div style="height:12px"></div><label></label><canvas id="pad"></canvas><div class="row"><span class="small"></span><button class="linkbtn" id="clr"></button></div><label class="check"><input type="checkbox" id="ok"><span></span></label><button class="btn" id="go"></button><p class="small" id="msg" style="margin:10px 0 0"></p>';
  app.appendChild(form);
  form.querySelector('label[for=nm]').textContent=T.name;form.querySelectorAll('label')[1].textContent=T.sign;
  form.querySelector('#clr').textContent=T.clear;form.querySelector('.check span').textContent=T.agree;form.querySelector('#go').textContent=T.btn;
  var nm=form.querySelector('#nm');nm.value=o.c?String(o.c).slice(0,80):'';
  app.appendChild(el('p','foot','Invoice Free del Obrero · '+(es?'Firma sellada en BSV':'Signature sealed on BSV')));
  var cv=form.querySelector('#pad'),x,empty=true;
  function setup(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;x=cv.getContext('2d');x.scale(d,d);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);x.strokeStyle='#111';x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';empty=true}
  setup();var down=false,last=null;
  function pt(e){var b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  cv.onpointerdown=function(e){down=true;last=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault()};
  cv.onpointermove=function(e){if(!down)return;var p=pt(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;empty=false;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=function(){down=false};
  form.querySelector('#clr').onclick=function(){setup()};
  var msg=form.querySelector('#msg'),go=form.querySelector('#go');
  /* small copy of the signature so it travels light (max 600 px wide, white background) */
  function sigImage(){var w=Math.min(600,cv.width),h=Math.round(cv.height*w/cv.width),c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(cv,0,0,w,h);return c.toDataURL('image/png')}
  function done(seal){
    try{localStorage.setItem(KEY,JSON.stringify({seal:seal||null}))}catch(e){}
    form.hidden=true;var c=el('div','card ok');var b=el('p',null);b.style.margin='0 0 6px';b.style.fontSize='20px';b.appendChild(el('b',null,'✓ '+T.done));c.appendChild(b);c.appendChild(el('p','small',seal?T.doneSub:T.noSeal));
    if(seal){var a=el('a','btn out',T.verify);a.href=new URL('sello.html',location.href).href.split(/[?#]/)[0]+'#n='+seal.net+'&t='+seal.txid+'&h='+seal.h+'&k=sig';a.target='_blank';a.rel='noopener';c.appendChild(a)}
    var text=T.msg(o.n,o.k),ph=String(o.sp||'').replace(/[^0-9+]/g,'');
    if(ph){var w=el('a','btn',T.tell);w.href='https://wa.me/'+ph.replace(/^\+/,'')+'?text='+encodeURIComponent(text);w.target='_blank';w.rel='noopener';c.appendChild(w);var m=el('a','btn out',T.tellSms);m.href='sms:'+ph+'?&body='+encodeURIComponent(text);c.appendChild(m)}
    app.insertBefore(c,form)}
  try{var prev=JSON.parse(localStorage.getItem(KEY)||'null');if(prev){done(prev.seal);return}}catch(e){}
  go.onclick=function(){
    var name=nm.value.trim();
    if(empty){msg.textContent=T.signFirst;return}if(!name){msg.textContent=T.nameFirst;nm.focus();return}if(!form.querySelector('#ok').checked){msg.textContent=T.agreeFirst;return}
    if(!CFG.supabaseUrl){msg.textContent=T.err;return}
    go.disabled=true;msg.textContent=T.sending;
    var img=sigImage(),at=new Date().toISOString(),seal=null;
    sha(img).then(function(ih){return sha(JSON.stringify(['obrero-sig-1',o.h,name,at,ih]))}).then(function(sh){
      return fetch(CFG.supabaseUrl+'/functions/v1/seal',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey},body:JSON.stringify({hash:sh,kind:'sig'})})
        .then(function(r){return r.json().catch(function(){return {}})}).then(function(j){if(j&&/^[0-9a-f]{64}$/.test(j.txid||''))seal={h:sh,txid:j.txid,net:j.net==='main'?'main':'test',at:Date.now()}}).catch(function(){})
    }).then(function(){
      return rpc('sign_put',{p_tok:o.t,p_data:JSON.stringify({img:img,name:name,at:at,h:o.h,ua:navigator.userAgent.slice(0,120),seal:seal})})
    }).then(function(){done(seal)}).catch(function(e){go.disabled=false;msg.textContent=/already/.test(String(e))?T.already:T.err});
  };
  }
})();
</script>
</body>
</html>
