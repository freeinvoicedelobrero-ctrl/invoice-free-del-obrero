<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Menú</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 190px}
h1{font-size:28px;margin:10px 0 2px;overflow-wrap:anywhere}
.sub{color:#9AA0AB;font-size:14px;margin:0 0 14px}
.it{display:flex;align-items:center;gap:12px;background:#0E0F12;border:1px solid #26292F;border-radius:14px;padding:12px;margin-bottom:10px}
.it img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.it .n{flex:1;min-width:0;overflow-wrap:anywhere}
.it .p{color:#9AA0AB;font-size:14px;font-variant-numeric:tabular-nums}
.it .off{color:#E0A83A;font-size:13px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:44px;height:44px;border-radius:50%;border:1px solid #26292F;background:#17191E;color:#fff;font-size:22px;line-height:1}
.q button:disabled{opacity:.35}
.q b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid #26292F;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid #4D6BFF;background:#4D6BFF;color:#fff;font-weight:600;font-size:16px}
.btn.o{background:none;color:#4D6BFF;border-color:#26292F}
.btn:disabled{opacity:.4}
.txt{width:100%;min-height:46px;border-radius:12px;border:1px solid #26292F;background:#0E0F12;color:#fff;font-size:16px;padding:10px 12px;margin-bottom:10px}
.empty{color:#9AA0AB;padding:40px 0;text-align:center}
.closed{border:1px dashed #E0A83A;color:#E0A83A;border-radius:12px;padding:12px;margin:0 0 14px}
.status{border:1px solid #2E7D5B;background:#0c1a14;border-radius:14px;padding:14px;margin:0 0 14px}
.status b{font-size:20px}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.contact a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #26292F;border-radius:999px;color:#fff;text-decoration:none;font-size:14px}
.foot{color:#9AA0AB;font-size:12px;text-align:center;margin-top:18px}
:focus-visible{outline:2px solid #4D6BFF;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="name">Menú</h1>
  <p class="sub" id="sub"></p>
  <div class="contact" id="contact"></div>
  <div class="status" id="status" hidden></div>
  <div class="closed" id="closed" hidden></div>
  <div id="list"></div>
  <p class="foot">Invoice Free del Obrero</p>
</div>
<div class="bar" id="bar" hidden><div class="in">
  <div class="tot"><span id="totLbl">Total</span><span id="tot"></span></div>
  <div id="extra"></div>
  <div class="btns" id="btns"></div>
</div></div>
<script src="config.js"></script>
<script>
/* Public menu page.
   Live menu:  menu.html?m=<id>  reads the menu the store published and sends orders straight to the store's app.
   Link menu:  menu.html#<data>  carries the whole menu inside the link (no server); orders go by WhatsApp or text. */
(function(){
  window.addEventListener('hashchange',function(){location.reload()});
  var es=(navigator.language||'es').toLowerCase().indexOf('es')===0;
  var T=es?{menu:'Menú',pick:'Toca + para armar tu pedido.',bad:'Este enlace de menú no es válido. Pide uno nuevo a la tienda.',none:'Esta tienda todavía no tiene productos.',wa:'Pedir por WhatsApp',sms:'Pedir por mensaje',share:'Enviar pedido',send:'Enviar pedido',sending:'Enviando…',order:'Pedido',total:'Total',less:'Quitar uno',more:'Agregar uno',closedH:'Cerrado ahora. Puedes ver el menú. Horario: ',closedM:'La tienda está cerrada por ahora. Puedes ver el menú.',call:'Llamar',mail:'Email',chat:'WhatsApp',off:'Agotado',loading:'Cargando el menú…',neterr:'No se pudo cargar el menú. Revisa tu Internet.',retry:'Reintentar',yourname:'Tu nombre (opcional)',note:'Nota para la tienda (opcional)',sent:'Pedido enviado',fail:'No se pudo enviar el pedido. Intenta de nuevo.',st:{new:'Recibido por la tienda. Esperando respuesta.',accepted:'Aceptado. Lo están preparando.',ready:'Listo para recoger.',done:'Entregado. ¡Gracias!',cancelled:'La tienda canceló este pedido.'},again:'Hacer otro pedido'}
           :{menu:'Menu',pick:'Tap + to build your order.',bad:'This menu link is not valid. Ask the shop for a new one.',none:'This shop has no products yet.',wa:'Order by WhatsApp',sms:'Order by text',share:'Send order',send:'Send order',sending:'Sending…',order:'Order',total:'Total',less:'Remove one',more:'Add one',closedH:'Closed now. You can still see the menu. Hours: ',closedM:'The shop is closed for now. You can still see the menu.',call:'Call',mail:'Email',chat:'WhatsApp',off:'Sold out',loading:'Loading the menu…',neterr:'Could not load the menu. Check your Internet.',retry:'Retry',yourname:'Your name (optional)',note:'Note for the shop (optional)',sent:'Order sent',fail:'Could not send the order. Try again.',st:{new:'Received by the shop. Waiting for an answer.',accepted:'Accepted. They are preparing it.',ready:'Ready for pickup.',done:'Delivered. Thank you!',cancelled:'The shop cancelled this order.'},again:'Place another order'};
  document.documentElement.lang=es?'es':'en';
  var $=function(id){return document.getElementById(id)};
  var CFG=window.OBRERO_CONFIG||{};
  function rpc(fn,args){return fetch(CFG.supabaseUrl+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey},body:JSON.stringify(args)}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})}
  function msg(text,retry){var l=$('list');l.textContent='';var d=document.createElement('div');d.className='empty';d.textContent=text;l.appendChild(d);if(retry){var b=document.createElement('button');b.type='button';b.className='btn';b.style.maxWidth='240px';b.style.margin='0 auto';b.style.display='block';b.textContent=T.retry;b.onclick=function(){location.reload()};l.appendChild(b)}}
  function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
  $('totLbl').textContent=T.total;$('name').textContent=T.menu;
  var mid=(new URLSearchParams(location.search).get('m')||'').toLowerCase();
  if(/^[a-z0-9]{12}$/.test(mid)){
    if(!CFG.supabaseUrl||!CFG.supabaseAnonKey){msg(T.bad);return}
    msg(T.loading);
    rpc('menu_get',{p_id:mid}).then(function(rows){if(!rows||!rows.length){msg(T.bad);return}var M;try{M=JSON.parse(rows[0].data)}catch(e){msg(T.bad);return}start(M,true)}).catch(function(){msg(T.neterr,true)});
  }else{
    var M0=null;try{M0=dec(location.hash.slice(1))}catch(e){M0=null}
    if(!M0||!Array.isArray(M0.i)){msg(T.bad);return}
    start(M0,false);
  }
  function start(M,live){
    if(!M||!Array.isArray(M.i)){msg(T.bad);return}
    var name=String(M.n||T.menu).slice(0,80),cur=/^[A-Z]{3}$/.test(M.c)?M.c:'USD',phone=String(M.p||'').replace(/[^\d+]/g,'');
    var items=M.i.map(function(x){return Array.isArray(x)?{n:x[0],p:x[1]}:x}).filter(function(x){return x&&x.n}).map(function(x){return{n:String(x.n).slice(0,120),p:Math.max(0,+x.p||0),ph:typeof x.ph==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(x.ph)?x.ph:'',off:!!x.off,q:0}});
    function money(n){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur}).format(n)}catch(e){return cur+' '+n.toFixed(2)}}
    /* open or closed: the store can close by hand (live menu) or by hours [openMinutes, closeMinutes, daysBitmask] */
    var open=true,H=Array.isArray(M.h)&&M.h.length===3?M.h.map(Number):null;
    function f2(x){return (x<10?'0':'')+x}function hhmm(v){return f2(Math.floor(v/60))+':'+f2(v%60)}
    if(M.open===false){open=false;$('closed').hidden=false;$('closed').textContent=T.closedM}
    else if(H){var now=new Date(),mm=now.getHours()*60+now.getMinutes(),dd=now.getDay(),o=H[0],c=H[1],on=function(d){return !!(H[2]&(1<<d))};
      open=o===c?on(dd):o<c?(on(dd)&&mm>=o&&mm<c):((on(dd)&&mm>=o)||(on((dd+6)%7)&&mm<c));
      if(!open){$('closed').hidden=false;$('closed').textContent=T.closedH+hhmm(o)+'–'+hhmm(c)}}
    var email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(M.e||'')?M.e:'';
    function link(label,href){var a=document.createElement('a');a.textContent=label;a.href=href;$('contact').appendChild(a)}
    var dg=phone.replace(/\D/g,''),full=dg.length===10?'1'+dg:dg;
    if(phone){link(T.chat,'https://wa.me/'+full);link(T.call,'tel:'+phone)}
    if(email)link(T.mail,'mailto:'+encodeURIComponent(email));
    document.title=name;$('name').textContent=name;$('sub').textContent=open?T.pick:'';
    var list=$('list');list.textContent='';
    if(!items.length){msg(T.none);return}
    var counters=[];
    items.forEach(function(it){
      var row=document.createElement('div');row.className='it';
      if(it.ph){var im=document.createElement('img');im.src=it.ph;im.alt='';row.appendChild(im)}
      var n=document.createElement('div');n.className='n';
      var t1=document.createElement('div');t1.textContent=it.n;var t2=document.createElement('div');t2.className='p';t2.textContent=money(it.p);
      n.appendChild(t1);n.appendChild(t2);
      if(it.off){var t3=document.createElement('div');t3.className='off';t3.textContent=T.off;n.appendChild(t3)}
      var q=document.createElement('div');q.className='q';
      var minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label',T.less+': '+it.n);
      var b=document.createElement('b');b.textContent='0';counters.push(b);
      var plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label',T.more+': '+it.n);
      if(!open||it.off){minus.disabled=true;plus.disabled=true}
      minus.onclick=function(){if(it.q>0){it.q--;b.textContent=it.q;upd()}};
      plus.onclick=function(){if(it.q<99){it.q++;b.textContent=it.q;upd()}};
      q.appendChild(minus);q.appendChild(b);q.appendChild(plus);row.appendChild(n);row.appendChild(q);list.appendChild(row);
    });
    function chosen(){return items.filter(function(i){return i.q>0})}
    function total(){return Math.round(items.reduce(function(a,i){return a+i.q*i.p},0)*100)/100}
    function text(){return T.order+' — '+name+'\n'+chosen().map(function(i){return i.q+' x '+i.n+'  '+money(i.q*i.p)}).join('\n')+'\n'+T.total+': '+money(total())}
    function btn(label,cls,fn){var b=document.createElement('button');b.type='button';b.className='btn'+(cls?' '+cls:'');b.textContent=label;b.onclick=fn;return b}
    function upd(){$('bar').hidden=!chosen().length;$('tot').textContent=money(total())}
    var btns=$('btns');
    if(live){
      var nm=document.createElement('input');nm.className='txt';nm.maxLength=40;nm.placeholder=T.yourname;nm.setAttribute('aria-label',T.yourname);
      var nt=document.createElement('input');nt.className='txt';nt.maxLength=140;nt.placeholder=T.note;nt.setAttribute('aria-label',T.note);
      $('extra').appendChild(nm);$('extra').appendChild(nt);
      var sendB=btn(T.send,'',function(){
        if(!chosen().length||sendB.disabled)return;sendB.disabled=true;sendB.textContent=T.sending;
        var data={items:chosen().map(function(i){return{n:i.n,q:i.q,p:i.p}}),total:total(),cur:cur,name:nm.value.trim(),note:nt.value.trim()};
        rpc('order_put',{p_menu:mid,p_data:JSON.stringify(data)}).then(function(rows){var r=rows&&rows[0];if(!r)throw new Error('empty');
          var o={id:r.order_id,num:r.order_num,token:r.order_token};try{localStorage.setItem('obrero-order-'+mid,JSON.stringify(o))}catch(e){}
          items.forEach(function(i){i.q=0});counters.forEach(function(c){c.textContent='0'});upd();watch(o);
        }).catch(function(){alertLine(T.fail)}).then(function(){sendB.disabled=false;sendB.textContent=T.send});
      });
      btns.appendChild(sendB);
      var last=null;try{last=JSON.parse(localStorage.getItem('obrero-order-'+mid)||'null')}catch(e){}
      if(last&&last.id&&last.token)watch(last);
    }else if(phone){
      btns.appendChild(btn(T.wa,'',function(){location.href='https://wa.me/'+full+'?text='+encodeURIComponent(text())}));
      btns.appendChild(btn(T.sms,'o',function(){location.href='sms:'+phone+'?&body='+encodeURIComponent(text())}));
    }else{
      btns.appendChild(btn(T.share,'',function(){var t=text();if(navigator.share){navigator.share({text:t}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(t)}}));
    }
    function alertLine(t){var s=$('status');s.hidden=false;s.textContent=t;s.scrollIntoView({block:'center'})}
    /* order status: asks the store's answer every 15 seconds while the page is visible */
    var timer=null;
    function watch(o){
      function paint(st){var s=$('status');s.hidden=false;s.textContent='';var b=document.createElement('b');b.textContent=T.sent+' #'+o.num;var p=document.createElement('div');p.textContent=T.st[st]||T.st['new'];s.appendChild(b);s.appendChild(p);s.scrollIntoView({block:'center'})}
      function ask(){if(document.hidden)return;rpc('order_get',{p_menu:mid,p_id:o.id,p_token:o.token}).then(function(rows){var r=rows&&rows[0];if(!r)return;paint(r.status);if(r.status==='done'||r.status==='cancelled'){clearInterval(timer);timer=null;try{localStorage.removeItem('obrero-order-'+mid)}catch(e){}}}).catch(function(){})}
      paint('new');if(timer)clearInterval(timer);timer=setInterval(ask,15000);ask();
    }
    upd();
  }
})();
</script>
</body>
</html>
