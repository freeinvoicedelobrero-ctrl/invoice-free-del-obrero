<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice Free del Obrero</title>
<meta name="description" content="Free, open-source invoicing for roofers and tradespeople. English / Español. Your data stays on your device.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Invoice Free del Obrero — one-column phone app, dark only. MIT License. */
:root{
  --bg:#000000; --surface:#0E0F12; --surface-2:#17191E; --line:#26292F;
  --fg:#FFFFFF; --muted:#9AA0AB; --accent:#4D6BFF; --accent-ink:#FFFFFF;
  --bad:#FF4D6D; --good:#22C77A; --warn:#F5B83D; --sent:#3A3D44;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.roofer{display:block;width:100%;max-width:420px;margin:0 auto 8px}
.roofer.small{max-width:260px;margin:4px auto 0}
.roofer .arm{transform-box:view-box;transform-origin:186px 130px}
@media (prefers-reduced-motion:no-preference){.roofer .arm{animation:tap 1.1s ease-in-out .5s 2}}
@keyframes tap{0%{transform:rotate(0)}45%{transform:rotate(62deg)}55%{transform:rotate(58deg)}100%{transform:rotate(0)}}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(40px,13vw,72px);line-height:.92;letter-spacing:.01em;margin:8px 0 12px}
.brand span{display:block}.brand .b2{color:var(--accent)}
.tag{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:30ch}
.credit{color:var(--muted);font-size:13px;margin-top:18px}
.privacy{color:var(--muted);font-size:13px;margin-top:8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:24px;height:24px}
.textbtn{background:none;border:0;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:8px 6px}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
main.withTotal{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}
.company{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 12px}
.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;margin-bottom:18px}
.banner svg{flex:none;width:24px;height:24px}
.banner p{margin:0 0 6px;font-weight:600;font-size:17px}
.banner .textbtn{padding:0}
.note{font-size:13px;color:var(--warn);border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .lbl{font-size:13px;color:var(--muted);font-weight:500}
.card .val{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.card.bad .lbl,.card.bad .val{color:var(--bad)}
.card.good .val{color:var(--good)}

/* lists */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .amt .a1{font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.b-unsent{border-color:var(--muted);color:var(--muted)}
.b-sent{background:var(--sent);color:#fff}
.b-partial{background:var(--warn);color:#000}
.b-overdue{background:var(--bad);color:#fff}
.b-paid,.b-accepted{background:var(--good);color:#000}
.b-draft{border-color:var(--muted);color:var(--muted)}
.b-estsent{background:var(--sent);color:#fff}
.red{color:var(--bad)}.green{color:var(--good)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--fg);font-family:var(--display);font-size:22px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs2 button{background:none;border:0;padding:14px 0;font-weight:600;letter-spacing:.1em;color:var(--muted);border-bottom:3px solid transparent}
.tabs2 button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sortbar select{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;max-width:70%}
.totalbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border-top:1px solid var(--line)}
.totalbar .wrap{display:flex;justify-content:space-between;padding-block:12px;font-family:var(--display);font-weight:700;font-size:22px}

/* bottom tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:12px;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(77,107,255,.35)}
.fab.lift{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.fab svg{width:28px;height:28px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheet-h .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.sheet-h h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:24px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{padding-block:8px 120px}
.group{margin:18px 0}
.group > .gl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.linkbtn svg{width:22px;height:22px}
.small{font-size:13px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tot.big{font-family:var(--display);font-size:24px;font-weight:700;border-bottom:0}
.tot.bal{color:var(--bad)}.tot.bal.zero{color:var(--good)}
.btn{border-radius:12px;padding:14px 16px;font-weight:600;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);width:100%;text-align:center;text-decoration:none;display:block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.outline{background:none;color:var(--accent);border-color:var(--line)}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.btns .wide{grid-column:1/-1}
.hero{padding:18px 0 6px}
.hero .no{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.hero .due{color:var(--muted);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv > span:first-child{color:var(--muted)}
.kv > span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.confirm{border:1px solid var(--bad);border-radius:12px;padding:12px;margin:10px 0}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--surface);border:0;padding:10px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.check{display:flex;gap:10px;align-items:center;padding:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo{position:relative;aspect-ratio:1;max-width:100%;background:var(--surface-2);border-radius:8px;overflow:hidden;border:0;padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);font-size:11px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.viewer{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px}
.viewer img{max-width:100%;max-height:60vh;border-radius:8px}
.paytabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.paybox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.qr{background:#fff;border-radius:10px;padding:10px;align-self:center;width:220px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere;background:var(--surface-2);border-radius:8px;padding:10px}
.wm{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.wm .main{flex:1;min-width:0}
.switch{width:46px;height:26px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
@media (max-width:360px){.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="welcome" hidden></div>
<div id="appShell" hidden>
  <header class="top"><div class="wrap"><h1 id="title">Home</h1><button class="iconbtn" data-act="lang" id="langBtn" aria-label="Language">EN</button></div></header>
  <main id="main"><div class="wrap" id="view"></div></main>
  <div class="totalbar" id="totalbar" hidden><div class="wrap"><span id="totalLbl">Total</span><span class="num" id="totalVal"></span></div></div>

  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>
<input type="file" id="vcfIn" accept=".vcf,text/vcard,text/x-vcard" hidden>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>

const idb=(()=>{let dbp;
  function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('obrero-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
  async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const x=d.transaction('photos',mode);const req=fn(x.objectStore('photos'));x.oncomplete=()=>res(req?req.result:undefined);x.onerror=()=>rej(x.error)})}
  return {put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))};
})();

async function processPhoto(file){
  let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height,sc=Math.min(1,1600/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height); /* re-encoding drops EXIF incl. GPS */
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
}

/* ---------- money math & status ---------- */
function calc(d){
  const sub=r2((d.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.rate||0),0));
  const dv=+d.discountValue||0;
  const disc=r2(d.discountType==='%'?sub*dv/100:dv);
  const tax=r2((sub-disc)*(+d.taxRate||0)/100);
  const total=r2(sub-disc+tax);
  const paid=r2((d.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));
  const balance=r2(total-paid);
  const due=addDays(d.date||todayISO(),d.dueDays??0);
  return {sub,disc,tax,total,paid,balance,due};
}
function status(d){
  const c=calc(d);
  if(d.kind==='estimate')return d.convertedTo||d.accepted?'accepted':(d.sent?'estsent':'draft');
  if(c.total>0&&c.balance<=0.005)return 'paid';
  if(!d.sent)return 'unsent';
  if(c.due<todayISO())return 'overdue';
  if(c.paid>0)return 'partial';
  return 'sent';
}

function dueText(d){const c=calc(d);if(d.kind==='estimate'||c.balance<=0.005)return '';const n=daysBetween(todayISO(),c.due);if(n>0)return t('dueIn',n);if(n===0)return t('dueToday');return `<span class="red">${t('overdueBy',-n)}</span>`}

  const over=cs.filter(x=>x.s==='overdue');
  const unpaid=cs.filter(x=>x.c.balance>0.005&&x.s!=='unsent');
  const sum=a=>money(a.reduce((s,x)=>s+x.c.balance,0));

const PRESETS={

  ln:{label:'Bitcoin Lightning',sym:'BTC',re:/^[^\s@]+@[^\s@]+\.[^\s@]+$/,hint:'you@wallet.com'},
  xmr:{label:'Monero (XMR)',sym:'XMR',cg:'monero',re:/^[48][1-9A-HJ-NP-Za-km-z]{94}$/},
  eth:{label:'Ethereum',sym:'ETH',cg:'ethereum',re:/^0x[a-fA-F0-9]{40}$/},
  usdc:{label:'USDC',sym:'USDC',stable:true,nets:['Ethereum','Base','Solana']},
  usdt:{label:'USDT',sym:'USDT',stable:true,nets:['Ethereum','Tron','Solana']},
  ltc:{label:'Litecoin',sym:'LTC',cg:'litecoin',re:/^(ltc1[ac-hj-np-z02-9]{11,71}|[LM3][a-km-zA-HJ-NP-Z1-9]{25,34})$/},
  sol:{label:'Solana',sym:'SOL',cg:'solana',re:/^[1-9A-HJ-NP-Za-km-z]{32,44}$/},

  zelle:{label:'Zelle',fiat:true,hint:'email / phone'},
  cashapp:{label:'Cash App',fiat:true,hint:'$cashtag'},
  venmo:{label:'Venmo',fiat:true,hint:'@usuario'},
  paypal:{label:'PayPal',fiat:true,hint:'paypal.me/usuario'}
};
const NET_RE={Ethereum:/^0x[a-fA-F0-9]{40}$/,Base:/^0x[a-fA-F0-9]{40}$/,Solana:/^[1-9A-HJ-NP-Za-km-z]{32,44}$/,Tron:/^T[1-9A-HJ-NP-Za-km-z]{33}$/};
function addrValid(m){const p=PRESETS[m.type];if(!p||!m.address)return true;if(p.stable)return (NET_RE[m.network]||/./).test(m.address.trim());if(m.type==='xmr')return /^4[1-9A-HJ-NP-Za-km-z]{94}$/.test(m.address.trim())||/^8/.test(m.address.trim());return p.re?p.re.test(m.address.trim()):true}
const methods=()=>Object.values(S.wallet).sort((a,b)=>(a.order||0)-(b.order||0));
const enabledMethods=()=>methods().filter(m=>m.enabled);
let prices={ts:0,data:null,failed:false};
async function fetchPrices(force){
  const ids=[...new Set(enabledMethods().map(m=>PRESETS[m.type]?.cg).filter(Boolean))];
  if(!ids.length)return;
  if(!force&&(prices.data||prices.failed)&&Date.now()-prices.ts<5*60e3)return;
  if(fetchPrices.busy)return;fetchPrices.busy=true;
  try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&ids='+ids.join(','));if(!r.ok)throw 0;prices={ts:Date.now(),data:await r.json(),failed:false}}catch(e){prices={ts:Date.now(),data:prices.data,failed:!prices.data}}
  fetchPrices.busy=false;
  const top=stack[stack.length-1];if(top&&top.pay)redrawSheet();
}
function coinAmount(m,usd){const p=PRESETS[m.type];if(!p)return null;if(p.stable)return r2(usd).toFixed(2);if(!p.cg||!prices.data||!prices.data[p.cg])return null;const px=prices.data[p.cg].usd;if(!px)return null;const v=usd/px;return v.toFixed(p.sym==='BTC'?8:p.sym==='XMR'?6:6)}
function ensureXmrSub(d,m){
  if(d.xmrSub&&d.xmrMethod===m.id)return d.xmrSub;
  const subs=(m.subaddresses||[]).map(s=>s.trim()).filter(Boolean);m.used=m.used||{};
  const free=subs.find(s=>!m.used[s]);if(!free)return null;
  m.used[free]=d.number;d.xmrSub=free;d.xmrMethod=m.id;persist();return free;
}
function payURI(m,d,amt){
  const a=(m.address||'').trim(),n=encodeURIComponent((lang==='es'?'Factura ':'Invoice ')+d.number);
  switch(m.type){
    case 'btc':return `bitcoin:${a}${amt?`?amount=${amt}&label=${n}`:''}`;
    case 'ln':return `lightning:${a}`;
    case 'xmr':{const sub=ensureXmrSub(d,m);if(!sub)return null;return `monero:${sub}${amt?`?tx_amount=${amt}&tx_description=${n}`:''}`}
    case 'eth':return `ethereum:${a}`;
    case 'ltc':return `litecoin:${a}${amt?`?amount=${amt}`:''}`;
    case 'sol':return `solana:${a}${amt?`?amount=${amt}`:''}`;
    case 'cashapp':{const tag=a.replace(/^\$/,'');return `https://cash.app/$${tag}${amt?'/'+amt:''}`}
    case 'venmo':return `https://venmo.com/u/${a.replace(/^@/,'')}`;
    case 'paypal':{const u=a.replace(/^https?:\/\//,'').replace(/^paypal\.me\//i,'');return `https://paypal.me/${u}${amt?'/'+amt+'USD':''}`}
    default:return a;
  }
}

function parseVcf(text){
  const lines=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split(/\r?\n/);const out=[];let cur=null;
  const val=l=>l.slice(l.indexOf(':')+1).replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/gi,' ').trim();
  for(const l of lines){const u=l.toUpperCase();
    if(u.startsWith('BEGIN:VCARD'))cur={name:'',mobile:'',emails:[],address:''};
    else if(u.startsWith('END:VCARD')){if(cur&&cur.name)out.push(cur);cur=null}
    else if(!cur)continue;
    else if(u.startsWith('FN'))cur.name=val(l);
    else if(u.startsWith('N:')&&!cur.name){const p=val(l).split(';');cur.name=[p[1],p[0]].filter(Boolean).join(' ')}
    else if(u.startsWith('TEL')&&!cur.mobile)cur.mobile=val(l);
    else if(u.startsWith('EMAIL'))cur.emails.push(val(l));
    else if(u.startsWith('ADR')&&!cur.address){const p=l.slice(l.indexOf(':')+1).split(';');cur.address=[p[2],p[3],[p[4],p[5]].filter(Boolean).join(' '),p[6]].map(s=>(s||'').trim()).filter(Boolean).join(', ')}
  }
  return out;
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const numv=s=>+String(s||'').replace(/[^0-9.\-]/g,'')||0;
function normDate(s){s=String(s||'').trim();if(!s)return todayISO();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0')}const d=new Date(s);return isNaN(d)?todayISO():isoOf(d)}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast(t('noData'));return}
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=H.findIndex(h=>h===n);if(i>=0)return i}for(const n of names){const i=H.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
  const iNum=col('invoice number','invoice #','invoice no','number','doc number'),iTot=col('total','amount');
  const iName=col('billing name','client name','client','customer','name','company');
  const byName={};Object.values(S.clients).forEach(c=>byName[c.name.toLowerCase()]=c);
  const ensureClient=(name)=>{name=(name||'').trim()||'Unknown';const k=name.toLowerCase();if(byName[k])return byName[k];const c={id:uid(),name,mobile:'',emails:[],address:'',notes:''};byName[k]=c;S.clients[c.id]=c;return c};
  let n=0;
  if(!(iNum>=0&&iTot>=0)){
    const iE=col('email'),iP=col('mobile','phone'),iA=col('billing address','address');
    for(const r of rows.slice(1)){const name=r[iName];if(!name)continue;const c=ensureClient(name);if(iE>=0&&r[iE])c.emails=[r[iE].trim()];if(iP>=0&&r[iP])c.mobile=r[iP].trim();if(iA>=0&&r[iA])c.address=r[iA].trim();n++}
  }else{
    const iD=col('invoice date','date','issued'),iDue=col('due date','due'),iPaid=col('amount paid','paid','payments'),iBal=col('balance due','balance','amount due','outstanding'),iSt=col('status'),iJob=col('project','job','reference','po');
    let maxN=0;const existing={};invoicesAll().forEach(d=>existing[d.number]=d);
    for(const r of rows.slice(1)){
      const num=(r[iNum]||'').replace(/^#/,'').trim();if(!num||existing[num])continue;
      const c=ensureClient(r[iName]);
      const total=numv(r[iTot]);let paid=iPaid>=0?numv(r[iPaid]):(iBal>=0?total-numv(r[iBal]):0);
      if(iPaid<0&&iBal<0&&iSt>=0&&/paid/i.test(r[iSt])&&!/un/i.test(r[iSt]))paid=total;
      const date=normDate(iD>=0?r[iD]:'');const due=iDue>=0&&r[iDue]?normDate(r[iDue]):addDays(date,30);
      let jobId='';const jn=iJob>=0?(r[iJob]||'').trim():'';
      if(jn){let j=Object.values(S.jobs).find(x=>x.clientId===c.id&&x.name===jn);if(!j){j={id:uid(),clientId:c.id,name:jn,address:''};S.jobs[j.id]=j}jobId=j.id}
      const d={id:uid(),kind:'invoice',number:num,date,clientId:c.id,jobId,items:[{desc:'Imported / Importado',qty:1,unit:'',rate:total}],discountType:'$',discountValue:0,taxRate:0,dueDays:Math.max(0,daysBetween(date,due)),payInstr:S.profile.payInstr||'',notes:'',sent:true,payments:paid>0?[{id:uid(),amount:r2(paid),date,method:'Other',ref:'',note:'Imported'}]:[],photos:[],includePhotos:true,updatedAt:Date.now()};
      S.docs[d.id]=d;existing[num]=d;n++;const pn=parseInt(num);if(pn>maxN)maxN=pn;
    }
    if(maxN>=(+S.profile.nextInvoice||0))S.profile.nextInvoice=maxN+1;
  }
  commit();toast(t('imported',n));
}

/* ---------- PDF & text ---------- */
function docText(d){
  const c=calc(d),p=S.profile,isEst=d.kind==='estimate',j=jobOf(d);
  let s=`${p.company}\n${isEst?'Estimate EST':'Invoice #'}${d.number} · ${fdate(d.date)}\n${t('billTo')}: ${clientName(d.clientId)}${j?`\n${t('job')}: ${j.name}${j.address?' — '+j.address:''}`:''}\n\n`;
  (d.items||[]).forEach(i=>s+=`${i.desc} — ${i.qty} ${i.unit||''} × ${money(i.rate)} = ${money((+i.qty||0)*(+i.rate||0))}\n`);
  s+=`\n${t('total')}: ${money(c.total)}`;
  if(!isEst)s+=`\n${t('paidSoFar')}: ${money(c.paid)}\n${t('balance')}: ${money(c.balance)}\n${t('dueDate')}: ${fdate(c.due)}`;
  if(d.payInstr)s+=`\n\n${t('payInstr')}:\n${d.payInstr}`;
  return s;
}
function drawQR(doc,text,x,y,size){if(!window.qrcode||!text)return;try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=size/n;doc.setFillColor(0,0,0);for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))doc.rect(x+c*cell,y+r*cell,cell+0.15,cell+0.15,'F')}catch(e){}}
async function buildPDF(d){
  if(!window.jspdf){toast('PDF library did not load. Check your connection.');return null}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});
  const p=S.profile,c=calc(d),cl=S.clients[d.clientId]||{},isEst=d.kind==='estimate',j=jobOf(d);
  const W=612,H=792,M=48;
  doc.setFillColor(0,0,0);doc.rect(0,0,W,100,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(p.company||'',M,44);
  doc.setFont('helvetica','normal');doc.setFontSize(9);
  const hdr=[...(p.address||'').split('\n'),[p.phone,p.email].filter(Boolean).join('  ·  '),p.license?'License # '+p.license:''].filter(Boolean);
  if(hdr.length)doc.text(hdr,M,60);
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text(isEst?'ESTIMATE':'INVOICE',W-M,44,{align:'right'});
  doc.setFontSize(11);doc.text((isEst?'EST ':'#')+d.number,W-M,62,{align:'right'});
  doc.setTextColor(0,0,0);let y=134;
  doc.setFontSize(9);doc.setTextColor(110);doc.text('BILL TO',M,y);doc.text(isEst?'DATE':'DATE / DUE',W-M,y,{align:'right'});
  doc.setTextColor(0);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(cl.name||'',M,y+16);
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  const addr=[cl.address,cl.mobile,(cl.emails||[]).filter(Boolean).join(', ')].filter(Boolean).join('\n');
  let ly=y+31;if(addr){const tl=doc.splitTextToSize(addr,260);doc.text(tl,M,ly);ly+=tl.length*12}
  doc.text(fdate(d.date)+(isEst?'':'  /  '+fdate(c.due)),W-M,y+16,{align:'right'});
  let ry=y+31;
  if(j){doc.setFontSize(9);doc.setTextColor(110);doc.text('JOB SITE',W-M,ry,{align:'right'});doc.setTextColor(0);doc.setFontSize(10);const jl=doc.splitTextToSize([j.name,j.address].filter(Boolean).join('\n'),230);doc.text(jl,W-M,ry+14,{align:'right'});ry+=14+jl.length*12}
  y=Math.max(ly,ry)+18;
  doc.autoTable({startY:y,margin:{left:M,right:M},head:[['Description','Qty','Unit','Rate','Amount']],body:(d.items||[]).map(i=>[i.desc,String(i.qty),i.unit||'',money(i.rate),money((+i.qty||0)*(+i.rate||0))]),headStyles:{fillColor:[0,0,0],textColor:255},styles:{fontSize:10,cellPadding:6},columnStyles:{1:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
  y=doc.lastAutoTable.finalY+20;
  const line=(l,v,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?12:10);doc.text(l,W-M-160,y);doc.text(v,W-M,y,{align:'right'});y+=b?20:16};
  line('Subtotal',money(c.sub));if(c.disc)line('Discount','-'+money(c.disc));if(c.tax)line('Tax',money(c.tax));line('Total',money(c.total),true);
  if(!isEst){line('Paid','-'+money(c.paid));line('Balance due',money(c.balance),true)}
  y+=8;doc.setFont('helvetica','normal');doc.setFontSize(10);
  const need=h=>{if(y+h>H-50){doc.addPage();y=M}};
  if(d.payInstr){const tl=doc.splitTextToSize(d.payInstr,W-2*M);need(20+tl.length*13);doc.setFont('helvetica','bold');doc.text('Payment instructions',M,y);y+=14;doc.setFont('helvetica','normal');doc.text(tl,M,y);y+=tl.length*13+10}
  if(!isEst&&c.balance>0.005){
    const ms=enabledMethods();
    if(ms.length){
      need(40);doc.setFont('helvetica','bold');doc.text('Pay with / Pagar con',M,y);y+=14;doc.setFont('helvetica','normal');doc.setFontSize(9);
      const crypto=ms.filter(m=>!PRESETS[m.type]?.fiat);
      ms.forEach(m=>{const pr=PRESETS[m.type]||{};const a=payAddress(m,d);const tl=doc.splitTextToSize(`${m.name||pr.label}${m.network?' ('+m.network+')':''}: ${a}`,W-2*M);need(tl.length*11+4);doc.text(tl,M,y);y+=tl.length*11+3});
      const qrs=crypto.slice(0,2);
      if(qrs.length){y+=6;need(130);qrs.forEach((m,k)=>{const pr=PRESETS[m.type]||{};const amt=coinAmount(m,c.balance);const uri=payURI(m,d,amt);const x=M+k*170;doc.setDrawColor(200);doc.rect(x,y,110,110);drawQR(doc,uri,x+5,y+5,100);doc.setFontSize(8);doc.text(`${m.name||pr.label}${amt?' · '+amt+' '+(pr.sym||''):''}`,x,y+122)});y+=136}
      doc.setFontSize(10);
    }
  }
  if(d.notes){const tl=doc.splitTextToSize(d.notes,W-2*M);need(20+tl.length*13);doc.setFont('helvetica','bold');doc.text('Notes',M,y);y+=14;doc.setFont('helvetica','normal');doc.text(tl,M,y);y+=tl.length*13}
  if(d.includePhotos!==false&&(d.photos||[]).length){
    doc.addPage();doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Job photos / Fotos del trabajo',M,M);
    const cw=(W-2*M-20)/3,ch=cw;let k=0;
    for(const ph of d.photos.slice(0,9)){
      const b=await idb.get(ph.id).catch(()=>null);if(!b)continue;
      const url=await blobToDataURL(b);
      const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url});if(!img)continue;
      const col=k%3,row=Math.floor(k/3),x=M+col*(cw+10),yy=M+16+row*(ch+28);
      const sc=Math.min(cw/img.width,ch/img.height),w=img.width*sc,h=img.height*sc;
      doc.addImage(url,'JPEG',x+(cw-w)/2,yy+(ch-h)/2,w,h);
      if(ph.caption){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(doc.splitTextToSize(ph.caption,cw)[0],x,yy+ch+12)}
      k++;
    }
  }
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(140);doc.text('Made with Invoice Free del Obrero',W/2,H-20,{align:'center'})}
  return doc;
}
const pdfName=d=>(d.kind==='estimate'?'Estimate-':'Invoice-')+d.number+'.pdf';
async function downloadPDF(d){const doc=await buildPDF(d);if(doc)doc.save(pdfName(d))}
async function sharePDF(d){
  const doc=await buildPDF(d);if(!doc)return;
  const file=new File([doc.output('blob')],pdfName(d),{type:'application/pdf'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:pdfName(d),text:docText(d).split('\n').slice(0,2).join(' · ')});if(!d.sent){d.sent=true;commit()}return}}catch(e){if(e&&e.name==='AbortError')return}
  doc.save(pdfName(d));
}

/* ---------- backup ---------- */
async function exportJSON(){
  const photos={};for(const d of Object.values(S.docs))for(const p of d.photos||[]){try{const b=await idb.get(p.id);if(b)photos[p.id]=await blobToDataURL(b)}catch(e){}}
  const data={app:'invoice-free-del-obrero',version:1,exportedAt:new Date().toISOString(),...JSON.parse(JSON.stringify(S)),photos};
  downloadBlob('obrero-backup-'+todayISO()+'.json',new Blob([JSON.stringify(data)],{type:'application/json'}));
  S.profile.lastBackup=todayISO();commit();
}
async function restoreJSON(o){
  let n=0;
  if(o.profile)S.profile={...S.profile,...o.profile,started:true};
  for(const col of ['clients','jobs','docs','saved','wallet'])for(const [k,v] of Object.entries(o[col]||{})){S[col][k]=v;n++}
  for(const [id,u] of Object.entries(o.photos||{})){try{await idb.put(id,await dataURLToBlob(u))}catch(e){}}
  lang=S.profile.lang||lang;commit();toast(t('imported',n));
}

  newEstimate:()=>openEditor(newDoc('estimate')),
  newClient:()=>openClientEditor(),
  newInvoiceFor:e=>openEditor(newDoc('invoice',{clientId:e.dataset.id})),
  newEstimateFor:e=>openEditor(newDoc('estimate',{clientId:e.dataset.id})),
  openDoc:e=>{payTab=null;showSheet(docDetail(e.dataset.id))},
  openClient:e=>{clientFilter='all';clientQuery='';showSheet(clientDetail(e.dataset.id))},
  editDoc:e=>openEditor(S.docs[e.dataset.id]),
  editClient:e=>openClientEditor(S.clients[e.dataset.id]),
  addItem:()=>{rememberScroll();D.items.push(emptyItem());redrawSheet();const k=D.items.length-1;$('#i'+k+'d')?.focus()},
  rmItem:e=>{rememberScroll();D.items.splice(+e.dataset.i,1);if(!D.items.length)D.items.push(emptyItem());redrawSheet()},
  saveLine:e=>{const i=D.items[+e.dataset.i];if(!i||!i.desc)return;const s={id:uid(),desc:i.desc,unit:i.unit||'',rate:+i.rate||0};S.saved[s.id]=s;persist();toast(t('lineSaved'))},
  pickSaved:()=>{rememberScroll();showSheet(savedSheet(true))},
  useSaved:e=>{const s=S.saved[e.dataset.id];closeSheet();const empty=D.items.length===1&&!D.items[0].desc&&!+D.items[0].rate;if(empty)D.items=[];D.items.push({desc:s.desc,qty:1,unit:s.unit||'',rate:+s.rate||0});redrawSheet()},
  discType:e=>{D.discountType=e.dataset.v;redrawSheet()},
  newClientFromEditor:()=>{openClientEditor(null,c=>{if(D){D.clientId=c.id;D.jobId='';NJ=null}})},
  sameBilling:e=>{NJ.same=e.checked;if(NJ.same){NJ.address=S.clients[D.clientId]?.address||''}redrawSheet()},
  useLocation:()=>{if(!navigator.geolocation){toast(t('locationFail'));return}navigator.geolocation.getCurrentPosition(pos=>{const v=pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5);if(NJ)NJ.address=v;redrawSheet()},()=>toast(t('locationFail')),{enableHighAccuracy:true,timeout:15000})},
  saveDoc:()=>saveDocFromEditor(),
  takePhoto:()=>{if((D.photos||[]).length>=9){toast(t('photoLimit'));return}$('#camIn').value='';$('#camIn').click()},
  pickPhotos:()=>{if((D.photos||[]).length>=9){toast(t('photoLimit'));return}$('#galIn').value='';$('#galIn').click()},
  incPhotos:e=>{D.includePhotos=e.checked},
  editPhoto:e=>{const k=+e.dataset.k;rememberScroll();showSheet(photoViewer(D,k,true))},
  viewPhoto:e=>{const d=S.docs[e.dataset.id];showSheet(photoViewer(d,+e.dataset.k,false))},
  photoNav:e=>{const top=stack[stack.length-1];top.k=(top.k+(+e.dataset.v)+top.doc.photos.length)%top.doc.photos.length;redrawSheet()},
  photoMove:e=>{const top=stack[stack.length-1];const ph=top.doc.photos;const k=top.k,n=k+(+e.dataset.v);if(n<0||n>=ph.length)return;[ph[k],ph[n]]=[ph[n],ph[k]];top.k=n;redrawSheet()},
  askDelPhoto:()=>{$('#delZone').innerHTML=`<div class="confirm"><p style="margin:0 0 10px">${t('confirmDel')}</p><div class="btns" style="margin:0"><button class="btn" data-act="back0">${t('cancel')}</button><button class="btn bad" data-act="delPhoto">${t('yesDel')}</button></div></div>`},
  delPhoto:()=>{const top=stack[stack.length-1];const [ph]=top.doc.photos.splice(top.k,1);if(ph&&!Object.values(S.docs).some(d=>d.id!==top.doc.id&&(d.photos||[]).some(p=>p.id===ph.id)))idb.del(ph.id).catch(()=>{});closeSheet()},
  addEmail:()=>{C.emails.push('');redrawSheet()},
  pickContacts:async()=>{try{const res=await navigator.contacts.select(['name','tel','email','address'],{multiple:true});startContactReview(res.map(c=>({name:(c.name||[])[0]||'',mobile:(c.tel||[])[0]||'',emails:(c.email||[]).slice(0,3),address:fmtAddr((c.address||[])[0])})))}catch(e){}},
  pickVcf:()=>{$('#vcfIn').value='';$('#vcfIn').click()},
  importVcfMenu:()=>{C=null;$('#vcfIn').value='';$('#vcfIn').click()},
  saveContacts:()=>{let saved=0,skipped=0;const names=new Set(Object.values(S.clients).map(c=>c.name.toLowerCase()));pickedContacts.forEach(c=>{if(!c.keep)return;if(names.has(c.name.toLowerCase())){skipped++;return}const cl={id:uid(),name:c.name,mobile:c.mobile||'',emails:(c.emails||[]).filter(Boolean),address:c.address||'',notes:''};S.clients[cl.id]=cl;names.add(c.name.toLowerCase());saved++});
    const skippedAll=pickedContacts.filter(c=>!c.keep).length+skipped;closeSheet();if(C&&C._new)closeSheet();C=null;commit();toast(t('imported',saved)+(skippedAll?' · '+t('skipped',skippedAll):''))},
  saveClient:()=>{C.name=(C.name||'').trim();if(!C.name){toast(t('required'));return}C.emails=C.emails.map(x=>x.trim()).filter(Boolean);const isNew=C._new;delete C._new;S.clients[C.id]=C;const cb=clientCb,c=C;C=null;clientCb=null;closeSheet();if(cb)cb(c);else if(isNew)showSheet(clientDetail(c.id));commit();toast(t('saved'))},
  askDelClient:()=>{$('#delZone').innerHTML=`<div class="confirm"><p style="margin:0 0 10px">${t('confirmDel')}</p><div class="btns" style="margin:0"><button class="btn" data-act="back0">${t('cancel')}</button><button class="btn bad" data-act="delClient">${t('yesDel')}</button></div></div>`},
  delClient:()=>{const id=C.id;C=null;delete S.clients[id];stack.length=0;redrawSheet();commit()},
  back0:()=>redrawSheet(),
  clientFilter:e=>{clientFilter=e.dataset.v;redrawSheet()},
  groupJob:e=>{groupJob=e.checked;redrawSheet()},
  pay:e=>showSheet(paySheet(e.dataset.id)),
  savePay:e=>{const d=S.docs[e.dataset.id];const amt=r2(+$('#p-amt').value);if(!amt)return;d.payments=d.payments||[];d.payments.push({id:uid(),amount:amt,date:$('#p-date').value||todayISO(),method:$('#p-m').value,ref:$('#p-ref').value.trim(),coin:$('#p-coin').value.trim(),txid:$('#p-tx').value.trim(),note:$('#p-note').value.trim()});d.sent=true;d.updatedAt=Date.now();closeSheet();commit();toast(t('saved'))},
  delPay:e=>{const d=S.docs[e.dataset.id];d.payments=(d.payments||[]).filter(p=>p.id!==e.dataset.p);commit()},
  toggleSent:e=>{const d=S.docs[e.dataset.id];d.sent=!d.sent;commit()},
  accept:e=>{S.docs[e.dataset.id].accepted=true;commit()},
  copyDoc:e=>copyText(docText(S.docs[e.dataset.id])),
  copy:e=>copyText(e.dataset.v),
  pdf:e=>downloadPDF(S.docs[e.dataset.id]),
  sharePdf:e=>sharePDF(S.docs[e.dataset.id]),
  payTab:e=>{payTab=e.dataset.v;redrawSheet()},
  refreshPrices:()=>fetchPrices(true),
  duplicate:e=>{const s=S.docs[e.dataset.id];openEditor(newDoc(s.kind,{clientId:s.clientId,jobId:s.jobId,items:JSON.parse(JSON.stringify(s.items||[])),discountType:s.discountType,discountValue:s.discountValue,taxRate:s.taxRate,payInstr:s.payInstr,notes:s.notes}))},
  convert:e=>{const s=S.docs[e.dataset.id];const inv=newDoc('invoice',{clientId:s.clientId,jobId:s.jobId,items:JSON.parse(JSON.stringify(s.items||[])),discountType:s.discountType,discountValue:s.discountValue,taxRate:s.taxRate,notes:s.notes,photos:JSON.parse(JSON.stringify(s.photos||[])),includePhotos:s.includePhotos,fromEstimate:s.id});delete inv._new;inv.updatedAt=Date.now();S.docs[inv.id]=inv;S.profile.nextInvoice=(parseInt(inv.number)||0)+1;s.convertedTo=inv.id;s.accepted=true;stack.pop();payTab=null;showSheet(docDetail(inv.id));commit();toast(t('saved'))},
  askDel:e=>{$('#delZone').innerHTML=`<div class="confirm"><p style="margin:0 0 10px">${t('confirmDel')}</p><div class="btns" style="margin:0"><button class="btn" data-act="back0">${t('cancel')}</button><button class="btn bad" data-act="delDoc" data-id="${e.dataset.id}">${t('yesDel')}</button></div></div>`},
  delDoc:e=>{const d=S.docs[e.dataset.id];delete S.docs[e.dataset.id];(d.photos||[]).forEach(p=>{if(!Object.values(S.docs).some(x=>(x.photos||[]).some(q=>q.id===p.id)))idb.del(p.id).catch(()=>{})});closeSheet();commit()},
  jobs:()=>showSheet(jobsSheet()),
  reports:()=>showSheet(reportsSheet()),
  savedItems:()=>showSheet(savedSheet(false)),
  newSaved:()=>showSheet(savedEditor()),
  editSaved:e=>showSheet(savedEditor(S.saved[e.dataset.id])),
  saveSaved:e=>{const d=$('#s-d').value.trim();if(!d)return;S.saved[e.dataset.id]={id:e.dataset.id,desc:d,unit:$('#s-u').value.trim(),rate:+$('#s-r').value||0};closeSheet();commit()},
  delSaved:e=>{delete S.saved[e.dataset.id];commit()},
  walletOpen:()=>showSheet(walletSheet()),
  newMethod:()=>showSheet(methodEditor()),
  editMethod:e=>showSheet(methodEditor(S.wallet[e.dataset.id])),
  toggleMethod:e=>{const m=S.wallet[e.dataset.id];m.enabled=!m.enabled;commit()},
  saveMethod:()=>{if(!M.address&&!(M.subaddresses||[]).length){toast(t('addressOrHandle'));return}M.address=(M.address||'').trim();if(PRESETS[M.type]?.stable&&!M.network)M.network=PRESETS[M.type].nets[0];const prev=S.wallet[M.id];if(prev)M.used=prev.used||M.used;S.wallet[M.id]=M;M=null;closeSheet();commit();toast(t('saved'))},
  askDelMethod:()=>{$('#delZone').innerHTML=`<div class="confirm"><p style="margin:0 0 10px">${t('confirmDel')}</p><div class="btns" style="margin:0"><button class="btn" data-act="back0">${t('cancel')}</button><button class="btn bad" data-act="delMethod">${t('yesDel')}</button></div></div>`},
  delMethod:()=>{delete S.wallet[M.id];M=null;closeSheet();commit()},
  settings:()=>showSheet(settingsSheet()),
  saveSettings:()=>{document.querySelectorAll('[data-s]').forEach(el=>{S.profile[el.dataset.s]=['nextInvoice','nextEstimate','defDue'].includes(el.dataset.s)?(+el.value||0):el.value});closeSheet();commit();toast(t('saved'))},
  importExport:()=>showSheet(ieSheet()),
  aboutOpen:()=>showSheet(aboutSheet()),
  pickFile:e=>{fileMode=e.dataset.v;$('#fileIn').value='';$('#fileIn').click()},
  exportCsv:()=>{const head=['Invoice Number','Client','Job','Job Site','Date','Due Date','Total','Paid','Balance','Status'];const rows=invoicesAll().sort(byNumDesc).map(d=>{const c=calc(d),j=jobOf(d);return [d.number,clientName(d.clientId),j?j.name:'',j?j.address:'',d.date,c.due,c.total.toFixed(2),c.paid.toFixed(2),c.balance.toFixed(2),status(d)]});downloadBlob('invoices-'+todayISO()+'.csv',new Blob([[head,...rows].map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'}))},
  exportJson:()=>exportJSON()
};
function photoViewer(doc,k,editable){return{live:false,doc,k,render(){
  const ph=this.doc.photos[this.k];if(!ph)return sheetHead('')+'';
  return sheetHead(`${t('photos')} ${this.k+1}/${this.doc.photos.length}`,{close:true})+`<div class="wrap sheet-b"><div class="viewer"><img data-photo="${ph.id}" alt="${esc(ph.caption||'')}">${ph.caption?`<p>${esc(ph.caption)}</p>`:''}
  <div class="btns" style="width:100%"><button class="btn" data-act="photoNav" data-v="-1">‹</button><button class="btn" data-act="photoNav" data-v="1">›</button>
  ${editable?`<button class="btn" data-act="photoMove" data-v="-1">← ${lang==='es'?'Mover':'Move'}</button><button class="btn" data-act="photoMove" data-v="1">${lang==='es'?'Mover':'Move'} →</button>`:''}</div>
  ${editable?`<div id="delZone" style="width:100%"><button class="btn bad" data-act="askDelPhoto">${t('del')}</button></div>`:''}</div></div>`;
}}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.type!=='checkbox')e.preventDefault();f(el)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){query=el.value;render();return}
  if(el.id==='cq'){clientQuery=el.value;const pos=el.selectionStart;redrawSheet();const q=$('#cq');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}return}
  if(el.id==='sortSel'){S.profile.sortKey=el.value;persist();render();return}
  if(D&&el.dataset.bind){
    if(el.dataset.bind==='clientId'){D.clientId=el.value;D.jobId='';NJ=null;redrawSheet();return}
    if(el.dataset.bind==='jobSel'){if(el.value==='__new'){NJ={name:'',address:'',same:false}}else{NJ=null;D.jobId=el.value}redrawSheet();return}
    D[el.dataset.bind]=el.value;updTotals();return}
  if(D&&el.dataset.item!==undefined){D.items[+el.dataset.item][el.dataset.k]=el.value;updTotals();return}
  if(D&&el.dataset.cap!==undefined){D.photos[+el.dataset.cap].caption=el.value;return}
  if(D&&NJ&&el.dataset.nj){NJ[el.dataset.nj]=el.value;return}
  if(D&&el.dataset.jaddr){const j=S.jobs[D.jobId];if(j){j.address=el.value;persist()}return}
  if(C&&el.dataset.c){C[el.dataset.c]=el.value;return}
  if(C&&el.dataset.email!==undefined){C.emails[+el.dataset.email]=el.value;return}
  if(el.dataset.pc!==undefined){pickedContacts[+el.dataset.pc].keep=el.checked;return}
  if(M&&el.dataset.m){
    if(el.dataset.m==='subaddresses')M.subaddresses=el.value.split(/\s+/).filter(Boolean);
    else M[el.dataset.m]=el.value;
    if(el.dataset.m==='type'){M.network=PRESETS[M.type]?.stable?PRESETS[M.type].nets[0]:'';redrawSheet();return}
    const v=$('#m-valid');if(v){const ok=addrValid(M);v.textContent=ok?'':t('looksWrong');v.className='small '+(ok?'':'red')}
  }
});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&(el.dataset.bind||el.dataset.item!==undefined||el.dataset.m||el.id==='sortSel'))el.dispatchEvent(new Event('input',{bubbles:true}));if(el.type==='checkbox'&&el.dataset.pc!==undefined)el.dispatchEvent(new Event('input',{bubbles:true}))});
async function addPhotoFiles(files){
  if(!D)return;D.photos=D.photos||[];
  for(const f of files){if(D.photos.length>=9){toast(t('photoLimit'));break}
    try{const blob=await processPhoto(f);const id=uid();await idb.put(id,blob);D.photos.push({id,caption:''})}catch(e){console.warn(e)}}
  rememberScroll();redrawSheet();
}
$('#camIn').addEventListener('change',e=>addPhotoFiles([...e.target.files]));
$('#galIn').addEventListener('change',e=>addPhotoFiles([...e.target.files]));
$('#vcfIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;startContactReview(parseVcf(await f.text()))});
$('#fileIn').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;const text=await file.text();
  try{if(fileMode==='json'||file.name.endsWith('.json'))await restoreJSON(JSON.parse(text));else importCSV(text)}catch(err){toast(err.message||'Import failed')}
});

/* ---------- boot ---------- */
load();
showWelcome=!S.profile.started;
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
